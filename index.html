<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103b48">
  <title>SBAS | Student Portal</title>
  <link rel="stylesheet" href="assets/student-portal.css">
</head>

<body class="student-portal-body">

  <!-- Student Login -->
  <div id="studentLogin" class="sp-login-shell">
    <form id="studentLoginForm" class="sp-login-card">

      <div class="sp-brand">SBAS</div>
      <p class="sp-eyebrow">SONAR BANGLA ADARSHO SCHOOL</p>

      <h1>Student Portal</h1>

      <p class="sp-muted">
        Sign in using your Student ID and registered phone number.
      </p>

      <label>
        Student ID
        <input
          id="spStudentId"
          autocomplete="username"
          placeholder="e.g. ST0001"
          required
          maxlength="30"
        >
      </label>

      <label>
        Registered Phone Number
        <input
          id="spPhone"
          type="tel"
          autocomplete="tel"
          placeholder="01XXXXXXXXX"
          required
          maxlength="20"
        >
      </label>

      <button
        class="sp-primary"
        id="spLoginButton"
        type="submit"
      >
        Sign In
      </button>

      <p id="spLoginError" class="sp-error" role="alert"></p>

      <a
        class="sp-back"
        href="https://sonarbanglaadarshoschool.github.io/sbas-school-management/"
      >
        Administrator Login
      </a>

    </form>
  </div>

  <!-- Student Dashboard -->
  <div id="studentApp" class="sp-app" hidden>

    <!-- Sidebar -->
    <aside class="sp-sidebar">

      <div class="sp-brand sp-brand-light">
        SBAS
        <small>STUDENT PORTAL</small>
      </div>

      <div class="sp-student-mini">
        <div class="sp-avatar" id="spAvatar">S</div>
        <b id="spSideName">Student</b>
        <small id="spSideId"></small>
      </div>

      <!-- Navigation -->
      <nav id="spNav">

        <button class="active" data-tab="profile">
          ▣ <span>My Profile</span>
        </button>

        <button data-tab="attendance">
          ✓ <span>Attendance</span>
        </button>

        <button data-tab="results">
          ▤ <span>Exam Results</span>
        </button>

        <button data-tab="routine">
          ▦ <span>Class Routine</span>
        </button>

        <button data-tab="notices">
          ▧ <span>School Notices</span>
        </button>

      </nav>

      <button class="sp-logout" id="spLogout">
        Sign Out
      </button>

    </aside>

    <!-- Main Content -->
    <main class="sp-main">

      <header class="sp-topbar">

        <div>
          <small>SONAR BANGLA ADARSHO SCHOOL</small>
          <h1 id="spPageTitle">My Profile</h1>
        </div>

        <span class="sp-secure">
          ● Secure Student Access
        </span>

      </header>

      <div id="spContent" class="sp-content">
        <p class="sp-loading">
          Loading your profile…
        </p>
      </div>

    </main>

  </div>

  <!-- Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- Project Configuration -->
  <script src="assets/firebase-config.js"></script>

  <!-- Student Portal Application -->
  <script src="assets/student-portal.js"></script>

</body>
</html>
